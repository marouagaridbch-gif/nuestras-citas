  const trip=S.luna.trip;let lun=t('setDate');if(trip.start){const n=Math.ceil((new Date(trip.start+'T00:00:00')-new Date().setHours(0,0,0,0))/864e5);lun=n>0?`${n} ${n===1?t('dayLeft'):t('daysLeft')}`:t('onTrip')}
  const s=cSums();const casaTxt=s.ps.length?t('progress',{a:s.ps.filter(p=>p.bought).length,b:s.ps.length}):t('noProg');
  d.innerHTML=`<div class="nc-dc"><b>💕 ${t('nextDate')}</b><span>${next?esc(next.titulo||'')+' · '+fd(next.fecha,{weekday:'short',day:'numeric',month:'short'})+(next.hora?' '+esc(next.hora):''):t('noNext')}</span></div><button type="button" class="nc-dc" data-go="luna"><b>✈️ ${t('nav2')}</b><span>${esc(lun)}</span></button><button type="button" class="nc-dc" data-go="casa"><b>🏡 ${t('nav3')}</b><span>${esc(casaTxt)}</span></button><button type="button" class="nc-dc" data-go="nosotros"><b>💞 ${tl('nav8')}</b><span>${(()=>{const d=togDays();const n=allDates().find(x=>x.n>=0);return (d!=null&&d>=0?tl('n_daysTogL').replace('{n}',d):tl('n_acuerdos')+': '+nl('acuerdo').length)+(n?' · '+n.title+' '+inTxt(n.n):'')})()}</span></button><button type="button" class="nc-dc" data-go="alquiler"><b>🔑 ${tl('nav7')}</b><span>${(()=>{const it=incT();return it?tl('a_dash').replace('{a}',eur(Math.round(it-fixedM()))):tl('a_dashNo')})()}</span></button><button type="button" class="nc-dc" data-go="stock"><b>📦 ${tl('nav4')}</b><span>${(()=>{const n=stItems().filter(i=>stLevel(i)!=='ok').length;return stItems().length?(n?tl('s_dash').replace('{n}',n):tl('s_dashOk')):tl('s_welcome').split('!')[0]+'!'})()}</span></button><button type="button" class="nc-dc" data-go="boda"><b>💍 ${tl('nav6')}</b><span>${(()=>{const n=bDays();return n==null?tl('b_dashNo'):n>0?tl('b_dash').replace('{n}',n):n===0?tl('b_today'):tl('b_married')})()}</span></button><button type="button" class="nc-dc" data-go="juegos"><b>🎲 ${tl('nav5')}</b><span>${(()=>{const[a,b]=scoreOf(null);return `${esc(nm(1))} ${a} – ${b} ${esc(nm(2))}`})()}</span></button>`;
}
function render(){
  $('ncN1').textContent=t('nav1');$('ncN2').textContent=t('nav2');$('ncN3').textContent=t('nav3');$('ncN4').textContent=tl('nav4');$('ncN5').textContent=tl('nav5');$('ncN6').textContent=tl('nav6');$('ncN7').textContent=tl('nav7');$('ncN8').textContent=tl('nav8');
  const y=window.scrollY;const ae=document.activeElement;const keep=ae&&ae.id&&['ncStayQ','ncAmt'].includes(ae.id)?ae.id:null;
  if(view==='luna')renderLuna();else if(view==='casa')renderCasa();else if(view==='stock')renderStock();else if(view==='boda')renderBoda();else if(view==='alquiler')renderAlquiler();else if(view==='nosotros')renderNosotros();else if(view==='juegos'){if(!G.game)renderJuegos();else updStat()}
  renderDash();
  window.scrollTo(0,y);if(keep&&$(keep))$(keep).focus();
}
const dash=document.createElement('div');dash.id='ncDash';dash.className='nc-dash';sw.after(dash);
dash.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(!b)return;view=b.dataset.go;try{localStorage.setItem('nc-view',view)}catch(_){}applyView();window.scrollTo({top:0})});

/* ================= eventos ================= */
sw.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(!b)return;view=b.dataset.view;try{localStorage.setItem('nc-view',view)}catch(_){}applyView();window.scrollTo({top:0})});
function onClick(e){
  const a=e.target.closest('a[data-noclick]');if(a){e.preventDefault();return}
  const rt=e.target.closest('[data-rtab]');if(rt&&!e.target.closest('button')){tabC='r:'+rt.dataset.rtab;try{localStorage.setItem('nc-casatab',tabC)}catch(_){}render();window.scrollTo({top:0});return}
  const z=e.target.closest('[data-zoom]');if(z){const lb=$('lb'),im=$('lbImg');if(lb&&im){im.src=z.dataset.zoom;lb.hidden=false}return}
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.ltab){tabL=d.ltab;try{localStorage.setItem('nc-lmtab',tabL)}catch(_){}render();return}
  if(d.ctab){tabC=d.ctab;try{localStorage.setItem('nc-casatab',tabC)}catch(_){}render();return}
  if(d.add){openForm(d.add,null,d.room?{room:d.room}:null);return}
  if(d.trip){openForm('trip');return}
  if(d.magic){showMagic=!showMagic;render();return}
  if(d.edit){const [st,id]=d.edit.split(':');const it=S[st].items[id];if(it)openForm(it.kind,it);return}
  if(d.del){if(b.classList.contains('danger')){const [st,id]=d.del.split(':');del(st,id);toast(t('deleted'));return}b.classList.add('danger');b.textContent=t('sure');setTimeout(()=>{if(b.isConnected){b.classList.remove('danger');b.textContent=t('del')}},3000);return}
  if(d.galdel){if(b.classList.contains('danger')){delGal(d.galdel);return}b.classList.add('danger');b.textContent=t('sure');setTimeout(()=>{if(b.isConnected){b.classList.remove('danger');b.textContent='✕'}},3000);return}
  if(d.filt){filt[d.filt]=d.v;render();return}
  if(d.quick){const [st,k]=d.quick.split(':');put(st,{id:rid(),kind:k,title:d.v,done:false,created:Date.now()});return}
  if(d.stay){const q=($('ncStayQ')||{}).value||'';filt.stayQ=q;if(!q.trim()){$('ncStayQ').focus();return}window.open(STAYS[+d.stay][1](q.trim()),'_blank','noopener');return}
  if(d.toaloj){const g=S.luna.items[d.toaloj];if(g)openForm('alojamiento',null,{title:g.title,place:g.place,link:g.link,img:g.img,notes:g.notes,status:g.status,sub:/airbnb/.test(host(g.link))?'apto':'hotel'});return}
  if(d.map){mapOpen[d.map]=!mapOpen[d.map];render();return}
  if(d.wx){if(wx[d.wx]&&!wx[d.wx].l){delete wx[d.wx];render()}else{const it=S.luna.items[d.wx];if(it)loadWx(it)}return}
  if(d.upd){const [st,id]=d.upd.split(':');upd[id]=!upd[id];render();if(upd[id]){const it=S[st].items[id];const u=it&&safeUrl(it.link);if(u)window.open(u,'_blank','noopener');setTimeout(()=>{const i=$('upd_'+id);if(i)i.focus()},50)}return}
  if(d.updsave){const [st,id]=d.updsave.split(':');const it=S[st].items[id];const v=parsePrice(($('upd_'+id)||{}).value);if(it&&v!=null){put(st,{...it,price:v,...priceTrack(it,v)});toast(t('priceSaved'))}upd[id]=false;render();return}
  if(d.tocal){const [st,id]=d.tocal.split(':');toCal(st,id);return}
  if(d.qroom){const k=d.qroom;put('casa',{id:rid(),kind:'rincon',rk:k,title:t('r_'+k),emoji:ROOMS[k][0],colors:[],created:Date.now()});return}
  if(d.qprod){const room=d.room||(filt.producto&&filt.producto!=='*'?filt.producto:'');put('casa',{id:rid(),kind:'producto',title:d.v,cat:d.qprod,prio:'necesario',qty:1,bought:false,room,created:Date.now()});toast(t('saved'));return}
}
luna.addEventListener('click',onClick);casa.addEventListener('click',onClick);
function onChange(e){
  const g=e.target.dataset&&e.target.dataset.gal;if(g){addGal(g,[...e.target.files]);e.target.value='';return}
  if(e.target.id==='ncCur'){conv.c=e.target.value;updConv();return}
  const v=e.target.dataset&&e.target.dataset.tog;if(!v)return;const [st,id,field]=v.split(':');const it=S[st].items[id];if(it)put(st,{...it,[field]:e.target.checked})}
function updConv(){const o=$('ncConvOut'),c=$('ncCur');if(!o||!c||!rates||typeof rates!=='object')return;o.textContent=((+conv.a||0)*rates[c.value]).toLocaleString(LOC[L],{maximumFractionDigits:2})+' '+c.value}
luna.addEventListener('change',onChange);casa.addEventListener('change',onChange);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ncStayQ'){e.preventDefault();filt.stayQ=e.target.value;const q=e.target.value.trim();if(q)window.open(STAYS[0][1](q),'_blank','noopener')}});
document.addEventListener('input',e=>{if(e.target.id==='ncStayQ')filt.stayQ=e.target.value;if(e.target.id==='ncAmt'){conv.a=e.target.value;updConv()}});

new MutationObserver(()=>{const l=document.documentElement.lang;if(T[l]&&l!==L){L=l;render()}}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
new MutationObserver(()=>{if(!app.hidden)connect();else{unsubs.forEach(u=>u());unsubs=[];sp=null}}).observe(app,{attributes:true,attributeFilter:['hidden']});
if(T[document.documentElement.lang])L=document.documentElement.lang;
readImport();
addEventListener('hashchange',()=>{readImport();if(pendingImport)askImport()});
if(!['cal','luna','casa','stock','juegos','boda','alquiler','nosotros'].includes(view))view='cal';
if(!LTABS.includes(tabL))tabL='resumen';if(!(['resumen','producto','tarea','cnota','presupuesto'].includes(tabC)||tabC.startsWith('r:')))tabC='resumen';
if(!app.hidden)connect();
applyView();
</script>
