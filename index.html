<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3EADF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%BC%3C/text%3E%3C/svg%3E">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}
.wrap.lock{min-height:80vh;display:grid;place-items:center}
.lock .card{max-width:420px;width:100%;padding:26px;display:flex;flex-direction:column;gap:14px;text-align:center;align-items:center}
.lock h2{font-family:var(--f-display);margin:0;font-size:26px}
.lock p{margin:0;font-family:var(--f-hand);font-size:20px;color:var(--soft);line-height:1.2}
.lock form{display:flex;flex-direction:column;gap:10px;width:100%}
.lock input{width:100%;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:11px 14px;outline:none;text-align:center;font-size:16px}
.lock small{color:var(--soft);font-size:12px}
.salir{all:unset;cursor:pointer;text-decoration:underline;font-family:var(--f-body);font-size:13px}
</style>
<title>Nuestras Citas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: tarjeta-cuaderno centrada; calendario arriba, día elegido + bote de ideas debajo (2 columnas en escritorio) */
:root{
  --bg:#F3EADF; --paper:#FBF7F1; --paper2:#F3E9DC;
  --ink:#4A3528; --soft:#8E7462; --line:#E4D4C1;
  --pink:#E2B4A5; --pink-d:#A86F4C; --peach:#EBCDB0; --mint:#CDD5B8; --lilac:#E3C9BF; --butter:#EEDDB6;
  --hamster:#D9A06E; --hamster-belly:#F8E9D6; --panda-w:#FFFDF9; --panda-k:#3E2C22;
  --shadow:0 6px 0 #E2D0BB;
  --btn-shadow:#7A4F33;
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,sans-serif;
  --f-hand:"Gaegu","Comic Sans MS","Nunito",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse at top,#FBF4EA 0%,transparent 60%);background-attachment:fixed;}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pink-d);outline-offset:2px;border-radius:12px}

/* Cabecera */
header.hero{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,6vw,46px);margin:0;line-height:1.05;text-wrap:balance;letter-spacing:.5px}
.hero h1 span+span{color:var(--pink-d)}
.hero p{margin:2px 0 0;font-family:var(--f-hand);font-size:21px;color:var(--soft)}
.mascot{width:78px;height:78px;flex:none}
.bob{animation:bob 3s ease-in-out infinite}
.bob2{animation:bob 3s ease-in-out -1.5s infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.bob,.bob2{animation:none}}

.banner{background:var(--butter);color:#5B3A4A;border-radius:16px;padding:10px 14px;font-weight:600;font-size:14px;text-align:center}

/* Tarjetas base */
.card{background:var(--paper);border:2.5px solid var(--line);border-radius:26px;box-shadow:var(--shadow)}

/* Calendario */
.cal{padding:18px}
.cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.cal-top h2{font-family:var(--f-display);font-size:24px;font-weight:600;margin:0}
.navbtn{width:42px;height:42px;border-radius:50%;border:2.5px solid var(--line);background:var(--paper2);font-size:20px;font-weight:700;display:grid;place-items:center}
.navbtn:hover{background:var(--pink);color:#fff;border-color:var(--pink)}
.today-btn{font-family:var(--f-display);border:2.5px solid var(--line);background:var(--paper2);border-radius:999px;padding:6px 14px;font-size:14px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow div{text-align:center;font-family:var(--f-display);font-size:13px;color:var(--soft);letter-spacing:1px;padding-bottom:4px}
.day{position:relative;aspect-ratio:1/1.05;max-width:100%;min-width:0;border-radius:16px;border:2px solid transparent;background:var(--paper2);padding:5px;display:flex;flex-direction:column;align-items:flex-start;overflow:hidden;text-align:left}
.day:hover{border-color:var(--pink)}
.day.out{opacity:.35}
.day .n{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1;z-index:1;background:var(--paper2);border-radius:8px;padding:2px 4px}
.day.today .n{background:var(--pink-d);color:#fff}
.day.sel{border-color:var(--pink-d);background:var(--paper);box-shadow:inset 0 0 0 2px var(--pink)}
.day .thumb{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.9}
.day .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 45%,rgba(0,0,0,.35))}
.day .tags{margin-top:auto;display:flex;flex-wrap:wrap;gap:2px;z-index:1;font-size:13px;line-height:1}
.day .heart{position:absolute;right:5px;top:4px;font-size:12px;z-index:1}
@media (max-width:480px){.cal{padding:12px}.dow,.grid{gap:4px}.day{border-radius:11px;padding:3px}.day .n{font-size:13px}.day .tags{font-size:11px}}

/* Columnas inferiores */
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

.panel{padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel-h{display:flex;align-items:center;gap:12px}
.panel-h h3{font-family:var(--f-display);font-size:22px;margin:0;font-weight:600;text-wrap:balance}
.panel-h h3::first-letter{text-transform:uppercase}
.panel-h .sub{font-family:var(--f-hand);font-size:19px;color:var(--soft);margin:0}
.mini{width:50px;height:50px;flex:none}

.plans{display:flex;flex-direction:column;gap:14px}
.plan{border-radius:20px;padding:14px 14px 12px;background:var(--paper2);border:2px dashed var(--line);display:flex;flex-direction:column;gap:8px;min-width:0}
.plan.done{border-style:solid;border-color:var(--mint)}
.plan-top{display:flex;align-items:flex-start;gap:10px}
.plan-emoji{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.plan-title{font-family:var(--f-display);font-weight:600;font-size:18px;margin:0;line-height:1.2;overflow-wrap:anywhere}
.plan-meta{font-size:13px;color:var(--soft);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;color:#5B3A4A}
.plan-note{font-family:var(--f-hand);font-size:20px;line-height:1.25;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.photo{position:relative;aspect-ratio:1;max-width:100%;border-radius:14px;overflow:hidden;border:3px solid var(--paper);box-shadow:0 3px 0 var(--line);transform:rotate(var(--r,0deg));background:var(--line)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo button.view{all:unset;position:absolute;inset:0;cursor:zoom-in}
.photo .x{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:none;background:rgba(255,255,255,.9);color:#5B3A4A;font-weight:700;font-size:13px;display:grid;place-items:center;z-index:2}
.plan-actions{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--pink)}
.chip.on{background:var(--mint);border-color:var(--mint);color:#3F4A2F}
.chip.danger{color:var(--pink-d)}
.chip[disabled]{opacity:.5;cursor:wait}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700}

/* Formularios */
form.add{display:flex;flex-direction:column;gap:10px;background:var(--paper);border-radius:20px;border:2.5px solid var(--line);padding:14px}
form.add .lbl{font-family:var(--f-display);font-size:16px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px;min-width:0}
input[type=text],input[type=time],textarea{width:100%;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:9px 12px;outline:none}
input:focus,textarea:focus{border-color:var(--pink)}
textarea{min-height:70px;resize:vertical;font-family:var(--f-hand);font-size:19px;line-height:1.2}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats label{cursor:pointer}
.cats input{position:absolute;opacity:0;pointer-events:none}
.cats span{display:inline-flex;gap:4px;align-items:center;padding:5px 11px;border-radius:999px;border:2px solid var(--line);font-size:13px;font-weight:700;background:var(--paper2)}
.cats input:checked+span{background:var(--c);border-color:var(--c);color:#5B3A4A}
.cats input:focus-visible+span{outline:3px solid var(--pink-d)}
.btn{font-family:var(--f-display);font-weight:600;font-size:16px;border:none;border-radius:999px;padding:10px 18px;background:var(--pink-d);color:#fff;box-shadow:0 4px 0 var(--btn-shadow)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--btn-shadow)}
.btn.ghost{background:var(--paper2);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn[disabled]{opacity:.6;cursor:wait}

.empty{display:flex;align-items:center;gap:12px;padding:14px;border-radius:20px;background:var(--paper2)}
.empty p{margin:0;font-family:var(--f-hand);font-size:20px;line-height:1.2}

/* Bote de ideas */
.jar{padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--paper);min-width:0}
.jar h3{font-family:var(--f-display);font-size:22px;margin:0;font-weight:600}
.jar .hint{margin:0;font-size:13px;color:var(--soft)}
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{display:flex;align-items:center;gap:8px;background:var(--paper2);border-radius:16px;padding:8px 10px;min-width:0}
.idea .t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.idea .t small{display:block;font-weight:400;color:var(--soft);font-family:var(--f-hand);font-size:17px;line-height:1.1}
.ic{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:14px;flex:none}
.ic:hover{border-color:var(--pink)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:2px dashed var(--line);background:transparent;border-radius:999px;padding:4px 10px;font-size:13px;font-weight:600}
.sugg button:hover{border-color:var(--pink);border-style:solid}
.jar form{display:flex;gap:6px}
.jar form input{flex:1;min-width:0}

/* Lightbox */
.lb{position:fixed;inset:0;background:rgba(30,18,28,.85);display:grid;place-items:center;z-index:50;padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb img{max-width:100%;max-height:85vh;border-radius:18px;border:6px solid #fff}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#5B3A4A;font-size:20px;font-weight:700}

.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;max-width:calc(100% - 32px);text-align:center}
footer{text-align:center;font-family:var(--f-hand);font-size:18px;color:var(--soft)}
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="hamster" viewBox="0 0 120 120">
      <ellipse cx="60" cy="112" rx="34" ry="5" fill="var(--line)"/>
      <circle cx="33" cy="30" r="13" fill="var(--hamster)" stroke="var(--panda-k)" stroke-width="3"/>
      <circle cx="33" cy="30" r="6.5" fill="var(--pink)"/>
      <circle cx="87" cy="30" r="13" fill="var(--hamster)" stroke="var(--panda-k)" stroke-width="3"/>
      <circle cx="87" cy="30" r="6.5" fill="var(--pink)"/>
      <path d="M14 72c0-30 20-48 46-48s46 18 46 48c0 24-20 38-46 38S14 96 14 72z" fill="var(--hamster)" stroke="var(--panda-k)" stroke-width="3"/>
      <path d="M30 80c0-14 13-22 30-22s30 8 30 22c0 15-13 25-30 25S30 95 30 80z" fill="var(--hamster-belly)"/>

      <circle cx="77" cy="60" r="5" fill="var(--panda-k)"/><circle cx="78.5" cy="58.3" r="1.6" fill="#fff"/>

      <ellipse cx="88" cy="72" rx="8" ry="5" fill="var(--pink)" opacity=".75"/>

    <symbol id="panda" viewBox="0 0 120 120">
      <ellipse cx="60" cy="112" rx="34" ry="5" fill="var(--line)"/>
      <circle cx="28" cy="28" r="15" fill="var(--panda-k)"/>
      <circle cx="92" cy="28" r="15" fill="var(--panda-k)"/>
      <ellipse cx="60" cy="66" rx="46" ry="42" fill="var(--panda-w)" stroke="var(--panda-k)" stroke-width="3"/>
      <ellipse cx="40" cy="62" rx="11" ry="14" transform="rotate(-25 40 62)" fill="var(--panda-k)"/>
      <ellipse cx="80" cy="62" rx="11" ry="14" transform="rotate(25 80 62)" fill="var(--panda-k)"/>
      <circle cx="42" cy="61" r="4.5" fill="#fff"/><circle cx="43" cy="59.8" r="1.8" fill="var(--panda-k)"/>
      <circle cx="78" cy="61" r="4.5" fill="#fff"/><circle cx="77" cy="59.8" r="1.8" fill="var(--panda-k)"/>
      <ellipse cx="60" cy="77" rx="6" ry="4" fill="var(--panda-k)"/>

      <ellipse cx="28" cy="82" rx="8" ry="5" fill="var(--pink)" opacity=".8"/>
      <ellipse cx="92" cy="82" rx="8" ry="5" fill="var(--pink)" opacity=".8"/>
      <path d="M78 18l5 -9 5 9 -5 4z" fill="var(--mint)" stroke="var(--panda-k)" stroke-width="2" stroke-linejoin="round"/>

</svg>
<style>
.langs{display:inline-flex;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:3px}
.langs button{border:none;background:transparent;border-radius:999px;padding:4px 11px;font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--soft)}
.langs button[aria-pressed="true"]{background:var(--pink-d);color:#fff}
.langs button:hover:not([aria-pressed="true"]){color:var(--ink)}
.topbar{display:flex;justify-content:flex-end}
.lock .langs{margin-bottom:4px}
:root[lang="ar"]{--f-display:"Baloo Bhaijaan 2","Fredoka",system-ui,sans-serif;--f-body:"Baloo Bhaijaan 2","Nunito",system-ui,sans-serif;--f-hand:"Baloo Bhaijaan 2","Gaegu",cursive}
:root[lang="ar"] .plan-note,:root[lang="ar"] textarea,:root[lang="ar"] .idea .t small{font-size:17px}
[dir="rtl"] .navbtn{transform:scaleX(-1)}
[dir="rtl"] .day{text-align:right}
[dir="rtl"] .day .heart{right:auto;left:5px}
[dir="rtl"] .photo .x{right:auto;left:3px}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;600;700&display=swap">

<div class="wrap lock" id="lock" hidden>
  <div class="card">
    <div class="langs" data-langs></div>
    <svg class="mascot bob" aria-hidden="true"><use href="#panda"/></svg>
    <h2><span data-i18n="h1a"></span> <span style="color:var(--pink-d)" data-i18n="h1b"></span></h2>
    <p data-i18n="lockText"></p>
    <form id="lockForm">
      <input type="password" id="secret" data-i18n-ph="secretPh" data-i18n-aria="secretPh" autocomplete="current-password" required minlength="4">
      <button class="btn" type="submit" data-i18n="enter"></button>
    </form>
    <small data-i18n="lockNote"></small>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <div class="topbar"><div class="langs" data-langs></div></div>
  <header class="hero">
    <svg class="mascot bob" aria-hidden="true"><use href="#hamster"/></svg>
    <div>
      <h1><span data-i18n="h1a"></span> <span data-i18n="h1b"></span></h1>
      <p data-i18n="tagline"></p>
    </div>
    <svg class="mascot bob2" aria-hidden="true"><use href="#panda"/></svg>
  </header>

  <div id="banner" class="banner" hidden></div>

  <section class="card cal" data-i18n-aria="calendar">
    <div class="cal-top">
      <button class="navbtn" id="prev" data-i18n-aria="prevM">‹</button>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center">
        <h2 id="monthTitle"></h2>
        <button class="today-btn" id="todayBtn" data-i18n="today"></button>
      </div>
      <button class="navbtn" id="next" data-i18n-aria="nextM">›</button>
    </div>
    <div class="dow" id="dow"></div>
    <div class="grid" id="grid"></div>
  </section>

  <div class="cols">
    <section class="card panel" aria-live="polite">
      <div class="panel-h">
        <svg class="mini" aria-hidden="true"><use href="#panda"/></svg>
        <div><h3 id="dayTitle"></h3><p class="sub" id="daySub"></p></div>
      </div>
      <div class="plans" id="plans"></div>

      <form class="add" id="addForm">
        <div class="lbl" id="formLbl"></div>
        <input type="hidden" id="editId">
        <div class="row">
          <input type="text" id="fTitle" data-i18n-ph="titlePh" data-i18n-aria="titleAria" maxlength="80" required>
          <input type="time" id="fTime" data-i18n-aria="timeAria" style="flex:0 1 120px">
        </div>
        <textarea id="fNote" data-i18n-ph="notePh" data-i18n-aria="noteAria" maxlength="600"></textarea>
        <div class="cats" id="cats"></div>
        <div class="row" style="align-items:center">
          <label class="chip" style="flex:0 0 auto;cursor:pointer" id="photoPick">
            <span data-i18n="addPhotos"></span><input type="file" id="fPhotos" accept="image/*" multiple hidden>
          </label>
          <span id="photoCount" style="font-size:13px;color:var(--soft);flex:1 1 auto"></span>
        </div>
        <div class="row" style="justify-content:flex-end">
          <button type="button" class="btn ghost" id="cancelEdit" hidden style="flex:0 0 auto" data-i18n="cancel"></button>
          <button type="submit" class="btn" id="saveBtn" style="flex:0 0 auto"></button>
        </div>
      </form>
    </section>

    <aside class="card jar" data-i18n-aria="jarTitle">
      <div class="panel-h">
        <svg class="mini" aria-hidden="true"><use href="#hamster"/></svg>
        <div><h3 data-i18n="jarTitle"></h3><p class="hint" data-i18n="jarHint"></p></div>
      </div>
      <div class="ideas" id="ideas"></div>
      <form id="ideaForm">
        <input type="text" id="ideaText" data-i18n-ph="newIdeaPh" data-i18n-aria="newIdeaPh" maxlength="80">
        <button class="btn" type="submit" style="padding:8px 14px">+</button>

function pickLang(){
  try{ const s=localStorage.getItem('nc-lang'); if(T[s]) return s; }catch(_){}
  const n=(navigator.language||'es').slice(0,2).toLowerCase();
  return T[n]?n:'es';
}
let lang = pickLang();
const L = () => LANGS.find(l=>l.k===lang);
const t = (k, vars) => { let s = (T[lang][k] ?? T.es[k] ?? k); if(vars) for(const v in vars) s=s.replace('{'+v+'}', vars[v]); return s; };

const CATS = [
  {k:'comida',  e:'🍜', c:'var(--peach)'},
  {k:'peli',    e:'🎬', c:'var(--lilac)'},
  {k:'paseo',   e:'🌿', c:'var(--mint)'},
  {k:'casa',    e:'🏠', c:'var(--butter)'},
  {k:'especial',e:'💖', c:'var(--pink)'},
  {k:'viaje',   e:'🧳', c:'var(--lilac)'}
];
const catOf = k => CATS.find(c=>c.k===k) || CATS[4];
const catName = k => t('cats')[catOf(k).k];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const keyOf = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromKey = k => { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); };
const rid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,10);

const now = new Date();
let view = new Date(now.getFullYear(), now.getMonth(), 1);
let selected = keyOf(now);
let plans = new Map();
let pendingFiles = [];
let confirmId = null;
let citasCol = null, fotosCol = null, unsub = null;
const fullCache = new Map();

function toast(msg){ const el=$('toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>el.hidden=true,2400); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---------- Aplicar idioma ---------- */
function applyLang(){
  const l = L();
  document.documentElement.lang = l.k;
  document.documentElement.dir = l.dir;
  document.title = (t('h1a')+' '+t('h1b')).trim();
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>el.placeholder=t(el.dataset.i18nPh));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',t(el.dataset.i18nAria)));
  document.querySelectorAll('[data-langs]').forEach(box=>{
    box.innerHTML = LANGS.map(x=>`<button type="button" data-lang="${x.k}" aria-pressed="${x.k===lang}" lang="${x.k}">${x.label}</button>`).join('');
  });
  $('dow').innerHTML = t('dow').map(d=>`<div>${d}</div>`).join('');
  const checked = document.querySelector('input[name=cat]:checked')?.value || 'especial';
  $('cats').innerHTML = CATS.map(c=>`<label style="--c:${c.c}"><input type="radio" name="cat" value="${c.k}" ${c.k===checked?'checked':''}><span>${c.e} ${catName(c.k)}</span></label>`).join('');
  $('sugg').innerHTML = t('sugg').map(s=>`<button type="button">${esc(s)}</button>`).join('');
  const editing = !!$('editId').value;
  $('formLbl').textContent = t(editing?'editTitle':'addTitle');
  if(!$('saveBtn').disabled) $('saveBtn').textContent = t(editing?'saveChanges':'save');
  updatePhotoCount();
  renderAll();
}
document.addEventListener('click', e=>{
  const b = e.target.closest('[data-lang]'); if(!b) return;
  lang = b.dataset.lang;
  try{ localStorage.setItem('nc-lang', lang); }catch(_){}
  applyLang();
});

/* ---------- Render ---------- */
function byDay(){
  const m = new Map();
  for (const [id,p] of plans){ if(!p.fecha) continue; if(!m.has(p.fecha)) m.set(p.fecha,[]); m.get(p.fecha).push({id,...p}); }
  return m;
}
function renderCal(){
  const days = byDay();
  const mt = fmt(view,{month:'long',year:'numeric'});
  $('monthTitle').textContent = mt.charAt(0).toUpperCase()+mt.slice(1);
  const first = new Date(view.getFullYear(), view.getMonth(), 1);
  const offset = (first.getDay()+6)%7;
  const start = new Date(first); start.setDate(1-offset);
  const todayK = keyOf(now);
  let html='';
  for(let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if(i===35 && d.getMonth()!==view.getMonth()) break;
    const k = keyOf(d);
    const list = days.get(k)||[];
    const photo = list.flatMap(p=>p.fotos||[])[0];
    const cls = ['day', d.getMonth()!==view.getMonth()?'out':'', k===todayK?'today':'', k===selected?'sel':''].join(' ');
    const label = fmt(d,{weekday:'long',day:'numeric',month:'long'}) + (list.length?` (${list.length})`:'');
    html += `<button class="${cls}" data-k="${k}" aria-label="${esc(label)}" aria-pressed="${k===selected}">
      ${photo?`<span class="thumb" style="background-image:url('${photo.thumb}')"></span>`:''}
      <span class="n">${d.getDate()}</span>
      ${list.some(p=>p.hecho)?'<span class="heart">💗</span>':''}
      <span class="tags">${list.slice(0,4).map(p=>catOf(p.cat).e).join('')}</span>
    </button>`;
  }
  $('grid').innerHTML = html;
}
function renderDay(){
  const d = fromKey(selected);
  const dt = fmt(d,{weekday:'long',day:'numeric',month:'long'});
  $('dayTitle').textContent = dt.charAt(0).toUpperCase()+dt.slice(1);
  const list = (byDay().get(selected)||[]).sort((a,b)=>(a.hora||'99').localeCompare(b.hora||'99'));
  $('daySub').textContent = list.length ? (list.length===1?t('plans1'):t('plansN',{n:list.length})) : t('whatToday');
  if(!list.length){
    $('plans').innerHTML = `<div class="empty"><svg class="mini" aria-hidden="true"><use href="#hamster"/></svg><p>${esc(t('emptyDay'))}</p></div>`;
    return;
  }
  $('plans').innerHTML = list.map(p=>{
    const c = catOf(p.cat);
    const fotos = (p.fotos||[]).map((f,i)=>`<div class="photo" style="--r:${[-3,2,-1,3,-2][i%5]}deg"><img src="${f.thumb}" alt="${esc(t('photoOf')+' '+p.titulo)}" loading="lazy"><button class="view" data-view="${esc(f.id)}" aria-label="${esc(t('viewPhoto'))}"></button><button class="x" data-delphoto="${p.id}" data-pid="${esc(f.id)}" aria-label="${esc(t('removePhoto'))}">✕</button></div>`).join('');
    const conf = confirmId===p.id
      ? `<span class="confirm">${esc(t('delQ'))} <button class="chip danger" data-delok="${p.id}">${esc(t('yesDel'))}</button><button class="chip" data-delno="1">${esc(t('no'))}</button></span>`
      : `<button class="chip danger" data-del="${p.id}">${esc(t('del'))}</button>`;
    return `<article class="plan ${p.hecho?'done':''}">
      <div class="plan-top">
        <div class="plan-emoji" style="background:${c.c}">${c.e}</div>
        <div style="min-width:0;flex:1">
          <h4 class="plan-title" dir="auto">${esc(p.titulo)}</h4>
          <div class="plan-meta">${p.hora?`<span>⏰ ${esc(p.hora)}</span>`:''}<span class="pill" style="background:${c.c}">${esc(catName(p.cat))}</span>${p.hecho?`<span class="pill" style="background:var(--mint)">${esc(t('donePill'))}</span>`:''}</div>
        </div>
      </div>
      ${p.nota?`<p class="plan-note" dir="auto">${esc(p.nota)}</p>`:''}
      ${fotos?`<div class="photos">${fotos}</div>`:''}
      <div class="plan-actions">
        <button class="chip ${p.hecho?'on':''}" data-done="${p.id}">${esc(t(p.hecho?'doneOn':'doneOff'))}</button>
        <label class="chip" style="cursor:pointer">${esc(t('photosBtn'))}<input type="file" accept="image/*" multiple hidden data-addphoto="${p.id}"></label>
        <button class="chip" data-edit="${p.id}">${esc(t('edit'))}</button>
        <button class="chip" data-tojar="${p.id}">${esc(t('toJar'))}</button>
        ${conf}
      </div>
    </article>`;
  }).join('');
}
function renderIdeas(){
  const ideas = [...plans].filter(([,p])=>!p.fecha).map(([id,p])=>({id,...p})).sort((a,b)=>(a.creado||0)-(b.creado||0));
  $('ideas').innerHTML = ideas.length ? ideas.map(p=>`<div class="idea">
      <span class="plan-emoji" style="width:32px;height:32px;font-size:16px;border-radius:11px;background:${catOf(p.cat).c}">${catOf(p.cat).e}</span>
      <span class="t" dir="auto">${esc(p.titulo)}${p.nota?`<small>${esc(p.nota)}</small>`:''}</span>
      <button class="ic" data-assign="${p.id}" aria-label="${esc(t('assign'))}">📅</button>
      <button class="ic" data-delidea="${p.id}" aria-label="${esc(t('removeIdea'))}">✕</button>
    </div>`).join('')
    : `<div class="empty" style="padding:10px"><p style="font-size:18px">${esc(t('jarEmpty'))}</p></div>`;
}
function renderAll(){ renderCal(); renderDay(); renderIdeas(); }

/* ---------- Guardado en Firebase ---------- */
async function savePlan(id, data){
  const nid = id || rid();
  plans.set(nid, data); renderAll();
  await setDoc(doc(citasCol, nid), data);
}
async function patchPlan(id, patch){
  const cur = plans.get(id); if(!cur) return;
  plans.set(id, {...cur, ...patch}); renderAll();
  try{ await updateDoc(doc(citasCol, id), patch); }catch(e){ toast(t('errSave')); }
}
async function removePlan(id){
  const p = plans.get(id);
  plans.delete(id); renderAll();
  try{
    await deleteDoc(doc(citasCol, id));
    for(const f of (p?.fotos||[])) await deleteDoc(doc(fotosCol, f.id)).catch(()=>{});
  }catch(e){ toast(t('errDel')); }
}

/* ---------- Fotos ---------- */
async function toJpeg(file, max, q){
  const img = await createImageBitmap(file);
  const s = Math.min(1, max/Math.max(img.width,img.height));
  const cv = document.createElement('canvas'); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg', q);
}
async function uploadFiles(files){
  const out=[];
  for(const f of files){
    try{
      let full = await toJpeg(f, 1400, 0.8);
      if(full.length > 900000) full = await toJpeg(f, 1000, 0.7);
      const thumb = await toJpeg(f, 260, 0.7);
      const id = rid();
      await setDoc(doc(fotosCol, id), {data: full, creado: Date.now()});
      fullCache.set(id, full);
      out.push({id, thumb});
    }catch(e){ toast(t('errPhoto')); }
  }
  return out;
}
async function openPhoto(id){
  $('lbImg').src = ''; $('lb').hidden=false; $('lbClose').focus();
  let src = fullCache.get(id);
  if(!src){
    const snap = await getDoc(doc(fotosCol, id)).catch(()=>null);
    src = snap?.exists() ? snap.data().data : null;
    if(src) fullCache.set(id, src);
  }
  if(src) $('lbImg').src = src; else { $('lb').hidden=true; toast(t('noPhoto')); }
}

/* ---------- Formulario ---------- */
function updatePhotoCount(){
  const n = pendingFiles.length;
  $('photoCount').textContent = n ? (n===1?t('photosReady1'):t('photosReadyN',{n})) : '';
}
$('fPhotos').addEventListener('change', e=>{ pendingFiles = [...e.target.files]; updatePhotoCount(); });
function resetForm(){
  $('addForm').reset(); $('editId').value=''; pendingFiles=[]; updatePhotoCount();
  $('formLbl').textContent=t('addTitle'); $('saveBtn').textContent=t('save'); $('cancelEdit').hidden=true;
  document.querySelector('input[name=cat][value=especial]').checked=true;
}
$('cancelEdit').onclick = resetForm;
$('addForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const titulo = $('fTitle').value.trim(); if(!titulo) return;
  const btn = $('saveBtn'); btn.disabled=true; btn.textContent = pendingFiles.length?t('uploading'):t('saving');
  try{
    const id = $('editId').value || null;
    const prev = id ? plans.get(id) : null;
    const nuevas = await uploadFiles(pendingFiles);
    const data = {
      titulo, nota:$('fNote').value.trim(), hora:$('fTime').value||'',
      cat: document.querySelector('input[name=cat]:checked')?.value || 'especial',
      fecha: prev ? prev.fecha : selected,
      fotos: [...(prev?.fotos||[]), ...nuevas],
      hecho: prev?.hecho||false, creado: prev?.creado||Date.now()
    };
    await savePlan(id, data);
    toast(t(id?'updated':'saved'));
    resetForm();
  }catch(err){ toast(t('errSave')); }
  finally{ btn.disabled=false; btn.textContent = t($('editId').value?'saveChanges':'save'); }
});

/* ---------- Clicks ---------- */
$('grid').addEventListener('click', e=>{
  const b = e.target.closest('.day'); if(!b) return;
  selected = b.dataset.k; confirmId=null;
  const d = fromKey(selected);
  if(d.getMonth()!==view.getMonth()) view = new Date(d.getFullYear(), d.getMonth(), 1);
  renderAll();
  if(window.innerWidth<820) document.querySelector('.panel').scrollIntoView({behavior:'smooth',block:'start'});
});
$('prev').onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()-1, 1); renderCal(); };
$('next').onclick = ()=>{ view = new Date(view.getFullYear(), view.getMonth()+1, 1); renderCal(); };
$('todayBtn').onclick = ()=>{ view = new Date(now.getFullYear(), now.getMonth(), 1); selected = keyOf(now); renderAll(); };

$('plans').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.view){ openPhoto(d.view); return; }
  if(d.done){ const p=plans.get(d.done); patchPlan(d.done,{hecho:!p.hecho}); if(!p.hecho) toast(t('cute')); return; }
  if(d.del){ confirmId=d.del; renderDay(); return; }
  if(d.delno){ confirmId=null; renderDay(); return; }
  if(d.delok){ confirmId=null; await removePlan(d.delok); toast(t('deleted')); return; }
  if(d.tojar){ patchPlan(d.tojar,{fecha:null}); toast(t('movedJar')); return; }
  if(d.delphoto){
    const p = plans.get(d.delphoto);
    await patchPlan(d.delphoto,{fotos:(p.fotos||[]).filter(f=>f.id!==d.pid)});
    deleteDoc(doc(fotosCol, d.pid)).catch(()=>{});
    return;
  }
  if(d.edit){
    const p = plans.get(d.edit);
    $('editId').value=d.edit; $('fTitle').value=p.titulo||''; $('fNote').value=p.nota||''; $('fTime').value=p.hora||'';
    const r=document.querySelector(`input[name=cat][value="${p.cat}"]`); if(r) r.checked=true;
    $('formLbl').textContent=t('editTitle'); $('saveBtn').textContent=t('saveChanges'); $('cancelEdit').hidden=false;
    $('addForm').scrollIntoView({behavior:'smooth',block:'center'}); $('fTitle').focus();
  }
});
$('plans').addEventListener('change', async e=>{
  const inp = e.target; if(!inp.dataset.addphoto) return;
  const id = inp.dataset.addphoto; const files=[...inp.files]; if(!files.length) return;
  toast(t('uploadingT'));
  const nuevas = await uploadFiles(files);
  const p = plans.get(id); if(!p) return;
  await patchPlan(id,{fotos:[...(p.fotos||[]),...nuevas]});
  if(nuevas.length) toast(t('photosAdded'));
});
$('ideas').addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.assign){ patchPlan(b.dataset.assign,{fecha:selected}); toast(t('ideaMoved',{d:fmt(fromKey(selected),{day:'numeric',month:'long'})})); }
  if(b.dataset.delidea){ removePlan(b.dataset.delidea); }
});
async function addIdea(titulo){
  titulo = titulo.trim(); if(!titulo) return;
  try{ await savePlan(null,{titulo,nota:'',hora:'',cat:'especial',fecha:null,fotos:[],hecho:false,creado:Date.now()}); toast(t('ideaAdded')); }
  catch(e){ toast(t('errSave')); }
}
$('ideaForm').addEventListener('submit', e=>{ e.preventDefault(); addIdea($('ideaText').value); $('ideaText').value=''; });
$('sugg').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) addIdea(b.textContent); });
$('lbClose').onclick = ()=>{ $('lb').hidden=true; };
$('lb').addEventListener('click', e=>{ if(e.target===$('lb')) $('lb').hidden=true; });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') $('lb').hidden=true; });

/* ---------- Entrada con palabra secreta ---------- */
let fdb = null;
try{ fdb = getFirestore(initializeApp(firebaseConfig)); }
catch(e){ const b=$('banner'); b.hidden=false; b.textContent=t('errConn'); }

async function spaceId(secret){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('nuestras-citas:'+secret.trim().toLowerCase()));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
}
function enter(sp){
  $('lock').hidden=true; $('app').hidden=false; renderAll();
  if(!fdb) return;
  citasCol = collection(fdb, 'espacios', sp, 'citas');
  fotosCol = collection(fdb, 'espacios', sp, 'fotos');
  unsub && unsub();
  unsub = onSnapshot(citasCol, snap=>{
    const m = new Map(); snap.forEach(d=>m.set(d.id, d.data())); plans = m; renderAll();
  }, err=>{ toast(t('errConn')); });
}
$('lockForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const sp = await spaceId($('secret').value);
  try{ localStorage.setItem('nc-space', sp); }catch(_){}
  enter(sp);
});
$('logout').onclick = ()=>{ try{ localStorage.removeItem('nc-space'); }catch(_){} unsub && unsub(); plans=new Map(); $('app').hidden=true; $('lock').hidden=false; $('secret').value=''; };

applyLang();
let saved=null; try{ saved = localStorage.getItem('nc-space'); }catch(_){}
if(saved) enter(saved); else $('lock').hidden=false;
</script>

.lm-tw td,.lm-tw th{padding:7px 6px;border-bottom:2px dotted var(--line);text-align:start}
.lm-tw th{font-size:11px;text-transform:uppercase;color:var(--soft)}
.lm-tw .r{text-align:end;font-variant-numeric:tabular-nums}
.lm-search{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lm-search input{flex:1;min-width:160px;border:2px solid rgba(244,213,141,.35);background:rgba(255,255,255,.08);color:var(--sky-ink);border-radius:12px;padding:9px 12px;font:inherit}
.lm-search input::placeholder{color:var(--sky-soft)}
.lm-magic{display:inline-block;background:var(--star);color:var(--night);font-family:var(--f-display);font-weight:700;padding:8px 14px;border-radius:999px;text-decoration:none;cursor:grab;box-shadow:0 0 16px rgba(244,213,141,.5)}
.lm-steps{margin:8px 0 0;padding-inline-start:20px;font-size:14px}
.lm-steps li{margin:3px 0}
/* casa */
.nc-pal{display:flex;height:36px;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.nc-pal i{flex:1;display:block}
.nc-pal.empty{background:repeating-linear-gradient(45deg,var(--paper2),var(--paper2) 6px,var(--paper) 6px,var(--paper) 12px);align-items:center;justify-content:center;font-size:12px;color:var(--soft);font-weight:700}
.nc-sw{display:flex;gap:6px;flex-wrap:wrap}
.nc-sw span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--soft);background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 9px 2px 3px}
.nc-sw span i{width:16px;height:16px;border-radius:50%;display:block;border:1px solid rgba(0,0,0,.15)}
.nc-palrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.nc-palrow input[type=color]{width:44px;height:38px;padding:2px;flex-shrink:0}
.nc-shop{display:flex;gap:5px;flex-wrap:wrap}
.nc-cathead{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:19px;color:var(--ink);margin:14px 0 8px}
.nc-cathead small{font-family:var(--f-body);font-size:13px;color:var(--soft);font-weight:700}
.nc-check{width:22px;height:22px;accent-color:var(--night2);flex-shrink:0;cursor:pointer}
/* modal */
#lmDlg{border:0;padding:0;border-radius:24px;width:min(560px,calc(100vw - 20px));max-height:calc(100dvh - 30px);background:var(--paper);color:var(--ink);box-shadow:0 20px 60px rgba(5,8,25,.6)}
#lmDlg::backdrop{background:rgba(8,12,32,.65)}
#lmDlg form{display:flex;flex-direction:column;max-height:calc(100dvh - 30px)}
.lm-dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 6px;gap:8px}
.lm-dh h3{font-family:var(--f-display);font-size:24px;margin:0}
.lm-db{padding:8px 18px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.lm-df{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px 16px;border-top:2px dotted var(--line)}
.lm-f{display:flex;flex-direction:column;gap:3px;min-width:0}
.lm-f.full{grid-column:1/-1}
.lm-f label{font-size:12px;font-weight:800;color:var(--soft)}
.lm-f input,.lm-f select,.lm-f textarea{border:2px solid var(--line);background:var(--paper2);border-radius:12px;padding:8px 10px;width:100%;min-width:0;font:inherit;color:var(--ink)}
.lm-f textarea{min-height:76px;resize:vertical}
.lm-f .prev{width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-top:6px}
.lm-choice{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;grid-column:1/-1}
.lm-choice button{border:2px solid var(--line);background:var(--paper2);border-radius:18px;padding:14px;font:inherit;font-weight:700;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;text-align:center}
.lm-choice button b{font-size:28px}
#ncClouds{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#ncClouds svg{position:absolute;left:0;opacity:.9;animation:ncDrift linear infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.18))}
@keyframes ncDrift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
.nc-gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.nc-galit{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line)}
.nc-galit img{width:100%;height:100%;object-fit:cover;cursor:zoom-in;display:block}
.nc-galx{position:absolute;top:4px;inset-inline-end:4px;border:0;border-radius:999px;min-width:24px;height:24px;padding:0 6px;background:rgba(15,22,51,.75);color:#fff;cursor:pointer;font-size:12px;font-weight:700}
.nc-galx.danger{background:var(--pink-d)}
.nc-notes{columns:230px;column-gap:12px}
.nc-note{break-inside:avoid;display:inline-block;width:100%;margin-bottom:12px;background:var(--nc);border-radius:6px 18px 18px 18px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.08);color:var(--ink)}
.nc-note h4{font-family:var(--f-display);margin:0 0 6px;font-size:17px;overflow-wrap:anywhere}
.nc-note p{margin:0 0 8px;white-space:pre-wrap;font-family:var(--f-hand);font-size:19px;line-height:1.3;overflow-wrap:anywhere}
.nc-map{width:100%;height:220px;border:0;border-radius:14px;display:block}
.nc-wx{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.nc-wx div{flex-shrink:0;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:6px 8px;text-align:center;font-size:12px;font-weight:700;min-width:58px;color:var(--ink)}
.nc-wx b{display:block;font-size:20px}
.nc-dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:-4px 0 16px;position:relative;z-index:2}
.nc-dc{background:rgba(255,255,255,.07);border:2px solid rgba(244,213,141,.25);border-radius:18px;padding:10px 14px;color:var(--sky-ink);text-align:start;font:inherit;display:flex;flex-direction:column;gap:2px;min-width:0}
button.nc-dc{cursor:pointer}button.nc-dc:hover{background:rgba(255,255,255,.12)}
.nc-dc b{font-family:var(--f-display);font-size:15px;color:var(--star)}
.nc-dc span{font-size:13px;color:var(--sky-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nc-conv{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nc-conv input,.nc-conv select{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 8px;font:inherit;color:var(--ink);min-width:0}
.nc-conv input{width:110px}
.nc-roomhero{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.nc-roomhero .big{font-size:44px;line-height:1}
@media (max-width:720px){.nc-dash{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){#ncClouds svg{animation:none}}
/* ===== Despensa ===== */
.st-q{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:6px}
.st-qb{width:44px;height:44px;border-radius:50%;border:0;background:var(--night2);color:var(--moon);font-size:24px;font-weight:700;cursor:pointer;line-height:1;flex-shrink:0;box-shadow:0 3px 0 #070B1E}
.st-qb:active{transform:translateY(2px);box-shadow:0 1px 0 #070B1E}
.st-qn{text-align:center;display:flex;flex-direction:column;min-width:0}
.st-qn b{font-family:var(--f-display);font-size:28px;line-height:1;color:var(--ink);font-variant-numeric:tabular-nums}
.st-qn small{font-size:12px;color:var(--soft);font-weight:700}
.lm-pill.st-bad{background:#F3CFC9;color:#8C2F25}
.st-in{width:72px;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 8px;font:inherit;color:var(--ink)}
/* ===== Juegos ===== */
.g-players{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.g-pl{flex:1;min-width:220px;display:flex;gap:10px;align-items:center;background:var(--paper2);border:2px solid var(--line);border-radius:20px;padding:10px 14px}
.g-name{width:100%;border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:6px 10px;font:inherit;font-weight:700;color:var(--ink)}
.g-pts{font-family:var(--f-display);font-size:34px;color:var(--ink);font-variant-numeric:tabular-nums}
.g-vs{font-family:var(--f-display);font-weight:700;color:#C9A04A;font-size:18px}
.g-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.g-card{background:var(--paper2);border:2px solid var(--line);border-radius:22px;padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s,border-color .15s;min-width:0}
.g-card:hover{transform:translateY(-3px);border-color:#C9A04A}
.g-card h4{margin:0;font-family:var(--f-display);font-size:19px;line-height:1.2}
.g-card p{margin:0;font-size:13px;color:var(--soft);font-weight:600}
.g-emo{font-size:36px;line-height:1}
.g-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.g-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.g-h{font-family:var(--f-display);font-size:24px;margin:0;flex:1;min-width:160px;color:var(--ink)}
.g-chip{display:inline-flex;align-items:center;gap:6px;background:var(--night2);color:var(--moon);border-radius:999px;padding:4px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.g-herosc b{color:var(--star);font-family:var(--f-display);font-size:20px}
.g-big{background:linear-gradient(135deg,var(--night2),#121A3E);color:var(--moon);border-radius:26px;padding:26px 22px;text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;position:relative;box-shadow:0 6px 0 #070B1E;margin-bottom:14px}
.g-big::before{content:"✦";position:absolute;top:12px;left:16px;color:var(--star);opacity:.7}
.g-big::after{content:"✧";position:absolute;bottom:12px;right:18px;color:var(--star);opacity:.7}
.g-big p{margin:0;font-family:var(--f-display);font-size:clamp(20px,3.4vw,28px);line-height:1.3;text-wrap:balance;max-width:34ch}
.g-cat{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--star)}
.g-whoin{display:inline-flex;gap:8px;align-items:center;background:rgba(255,255,255,.1);border-radius:999px;padding:4px 12px 4px 4px;font-size:14px}
.g-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:12px 0}
.g-main{font-size:17px;padding:12px 22px}
.g-lead{text-align:center;color:var(--soft);font-weight:700;margin:4px 0 12px}
.g-who{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:800;color:var(--ink);margin:8px 0 12px;text-align:center}
.g-result{text-align:center;font-family:var(--f-display);font-size:26px;color:var(--ink);margin:10px 0}
.g-err{color:#B2453A;font-weight:700;text-align:center;margin:4px 0}
.g-in{width:100%;border:2px solid var(--line);background:var(--paper2);border-radius:14px;padding:12px 14px;font:inherit;font-size:17px;color:var(--ink);text-align:center}
.g-pref{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:12px}
.g-opt{border-radius:22px;padding:22px 14px;font-family:var(--f-display);font-size:clamp(17px,2.6vw,22px);display:flex;align-items:center;justify-content:center;text-align:center;color:var(--ink);border:3px solid transparent;min-width:0;overflow-wrap:anywhere}
.g-optA{background:#F2C9C0}.g-optB{background:#D6E2C2}
.g-opt.sel{border-color:#C9A04A}
.g-or{align-self:center;font-family:var(--f-display);color:var(--soft);font-size:18px}
.g-prows{display:flex;flex-direction:column;gap:8px}
.g-prow{display:flex;align-items:center;gap:10px;background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:8px 12px;flex-wrap:wrap}
.g-pb{width:48px;height:42px;border-radius:12px;border:2px solid var(--btn-shadow);font-family:var(--f-display);font-size:18px;font-weight:700;cursor:pointer;color:var(--ink)}
.g-pbA{background:#F2C9C0}.g-pbB{background:#D6E2C2}
.g-pres{border-radius:10px;padding:4px 10px;font-weight:700;font-size:14px;color:var(--ink);max-width:100%}
.g-pres.a{background:#F2C9C0}.g-pres.b{background:#D6E2C2}
.g-cmp2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-ans{font-family:var(--f-display);font-size:22px;margin:6px 0 0;color:var(--ink);overflow-wrap:anywhere}
.g-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
.g-roles .g-card{align-items:center;text-align:center}
.g-fig{width:100%;max-width:400px;display:block;margin:0 auto;border-radius:18px;border:3px solid var(--line);background:#fff;aspect-ratio:1}
.g-figw{max-width:400px;margin:0 auto}
.g-paperbox{display:flex;align-items:center;justify-content:center;font-size:60px}
.g-cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g-cmp figure{margin:0;text-align:center;min-width:0}
.g-cmp figcaption{font-weight:800;color:var(--soft);font-size:13px;margin-top:4px}
.g-wait{text-align:center;color:var(--soft);font-weight:700}
.g-pad{width:100%;max-width:460px;aspect-ratio:1;display:block;margin:0 auto;background:#fff;border:3px solid var(--line);border-radius:18px;touch-action:none;cursor:crosshair}
.g-tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;margin:10px auto;max-width:460px}
.g-col{width:30px;height:30px;border-radius:50%;border:3px solid var(--paper);box-shadow:0 0 0 2px var(--line);cursor:pointer;padding:0;font-size:14px}
.g-col.on{box-shadow:0 0 0 3px var(--night2)}
.g-eraser{background:#fff}
.g-sep{width:1px;height:24px;background:var(--line)}
.g-sz{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.g-sz i{display:block;border-radius:50%;background:var(--ink)}
.g-sz.on{border-color:var(--night2)}
.g-ready{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.g-ready h3{font-family:var(--f-display);font-size:26px;margin:0;color:var(--ink)}
.g-playbar{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.g-timer{width:62px;height:62px;border-radius:50%;background:var(--night2);color:var(--star);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums;flex-shrink:0}
.g-timer.hurry{background:#B2453A;color:#fff;animation:gPulse 1s infinite}
.g-wordbox{flex:1;min-width:160px;background:var(--paper2);border:2px solid var(--line);border-radius:16px;padding:6px 14px;display:flex;flex-direction:column}
.g-wordbox small{font-size:12px;font-weight:800;color:var(--soft)}
.g-wordbox b{font-family:var(--f-display);font-size:24px;color:var(--ink)}
.g-wordbox b.blur{filter:blur(9px);user-select:none}
.g-wordbig p{font-size:clamp(30px,6vw,46px)!important}
.g-c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--night2);padding:10px;border-radius:20px;max-width:460px;margin:0 auto;box-shadow:0 6px 0 #070B1E}
.g-cell{aspect-ratio:1;border-radius:50%;border:0;background:rgba(255,255,255,.1);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;min-width:0}
.g-cell:hover{background:rgba(255,255,255,.18)}
.g-tok{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:3px;box-sizing:border-box}
.g-tok.t1{background:#F4D58D}.g-tok.t2{background:#F2C9C0}
.g-cell.win{box-shadow:0 0 0 3px #fff,0 0 14px #F4D58D}
.g-cell.drop .g-tok{animation:gDrop .35s ease-out}
.g-memsc{text-align:center;font-weight:800;color:var(--ink);margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.g-mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:0 auto}
.g-mc{aspect-ratio:1;border-radius:16px;border:0;background:var(--night2);color:var(--star);font-size:clamp(26px,6vw,38px);cursor:pointer;box-shadow:0 4px 0 #070B1E;transition:transform .2s,background .2s}
.g-mc.open{background:var(--paper);box-shadow:0 4px 0 var(--line);transform:rotateY(0)}
.g-mc.by1{background:#F6E6B4;box-shadow:0 4px 0 #C9A04A}.g-mc.by2{background:#F2C9C0;box-shadow:0 4px 0 #C98E80}
.g-wheelw{position:relative;width:min(330px,100%);margin:0 auto 6px}
.g-wheel{width:100%;display:block;transition:transform 3.3s cubic-bezier(.17,.67,.12,1);filter:drop-shadow(0 6px 0 #070B1E)}
.g-pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;color:#B2453A;z-index:2;text-shadow:0 2px 0 #fff}
.g-story{background:var(--paper2);border:2px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px}
.g-story p{margin:0 0 8px;font-family:var(--f-hand);font-size:21px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.g-start{font-style:italic;color:var(--soft)!important}
.g-line.p1{color:#7A5A12!important}.g-line.p2{color:#8C3F4F!important}
.g-saved{margin-bottom:8px}.g-saved summary{cursor:pointer;font-weight:800;color:var(--ink)}
@keyframes gPulse{50%{transform:scale(1.08)}}
@keyframes gDrop{from{transform:translateY(-220px)}to{transform:translateY(0)}}
@media (max-width:560px){.g-pref{grid-template-columns:1fr}.g-or{justify-self:center}.g-cmp2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.g-wheel{transition:none}.g-cell.drop .g-tok,.g-timer.hurry{animation:none}}

/* ===== Boda ===== */
.b-rsvp{display:inline-flex;gap:3px}
.b-rb{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-size:15px;padding:0;opacity:.45;filter:grayscale(.6)}
.b-rb.on{opacity:1;filter:none;border-color:var(--night2)}
.b-rb.on.si{background:#D6E2C2}.b-rb.on.no{background:#F3CFC9}.b-rb.on.pendiente{background:#F6E6B4}
.b-tsvg{width:150px;max-width:100%;display:block;margin:0 auto}
.b-names{display:flex;flex-wrap:wrap;gap:4px;justify-content:center}
.b-name{font-size:12px;font-weight:700;background:var(--paper);border:1.5px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--ink)}
.b-phase{margin-bottom:6px}
.b-phase .nc-cathead{flex-wrap:wrap}
#lock .langs button:not([aria-pressed="true"]){color:var(--soft)!important}
#lock .langs{background:var(--paper2)!important;border-color:var(--line)!important}

.a-cnt b{font-size:22px!important;line-height:1.1}
.a-cnt span{font-size:11px;max-width:90px;display:block;margin:0 auto}
.a-bar{height:18px;margin:4px 0 10px}
.a-bar i{display:block;height:100%}
.a-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink)}
.a-leg span{display:inline-flex;align-items:center;gap:5px}
.a-leg i{width:10px;height:10px;border-radius:3px;display:inline-block}
.a-gauge{position:relative;height:16px;border-radius:999px;background:linear-gradient(90deg,#BFE3C1 0 50%,#F6E1A6 50% 66%,#F3CFC9 66%);overflow:hidden}
.a-gauge i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:999px;background:var(--night2);opacity:.85}
.a-gauge s{position:absolute;top:0;bottom:0;width:2px;background:var(--paper)}
.a-rule.ok{border-color:#9FD0A4}.a-rule.mid{border-color:#E8C76A}.a-rule.bad{border-color:#E39A8F}
.lm-pill.a-ok{background:#D7EFD8;color:#245A2E}.lm-pill.a-mid{background:#F8E9B8;color:#7A5A10}.lm-pill.a-bad{background:#F3CFC9;color:#8C2F25}
.a-chosen{border-color:#C9A04A!important;box-shadow:0 0 0 3px rgba(244,213,141,.45)}
.a-off{opacity:.6}
.a-search{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.a-search .st-in{flex:1;min-width:160px;width:auto}
.a-cmp{overflow-x:auto;border:2px solid var(--line);border-radius:16px;background:var(--paper2)}
.a-cmp table{border-collapse:collapse;width:100%;font-size:14px;color:var(--ink);min-width:420px}
.a-cmp th,.a-cmp td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
.a-cmp thead th{font-family:var(--f-display);font-size:15px;background:var(--paper)}
.a-cmp tbody th{color:var(--soft);font-weight:700}
.a-cmp td.best{background:#D7EFD8;font-weight:800}
.a-total{border-top:2px solid var(--line);margin-top:4px;padding-top:8px;font-size:17px}
.a-month{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap}
.a-month b{font-family:var(--f-display);font-size:20px;color:var(--ink);min-width:150px;text-align:center}
.a-pig{display:flex;align-items:center;gap:12px}
.a-pig svg{width:70px;height:70px;flex:none}

.n-rules{display:flex;flex-direction:column;gap:10px}
.n-rule{display:flex;gap:12px;align-items:flex-start;background:var(--paper2);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.n-rule.star{border-color:#C9A04A;box-shadow:0 0 0 3px rgba(244,213,141,.35)}
.n-num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--night2);color:var(--star);font-family:var(--f-display);font-size:17px}
.n-txt{margin:2px 0 4px;font-size:16px;font-weight:700;color:var(--ink);white-space:pre-wrap}
.n-big{font-family:var(--f-display);font-size:20px;line-height:1.35;margin:0 0 12px;color:var(--sky-ink)!important}
.n-motto{font-family:var(--f-hand,var(--f-display));font-size:18px;color:var(--pink-d);margin:6px 0}
.n-custom{border-inline-start:6px solid var(--pink-d)}
.n-date{align-items:flex-start}
.n-date.soon{border-color:#C9A04A}
.n-cd{display:flex;align-items:baseline;gap:6px}
.n-cd b{font-family:var(--f-display);font-size:34px;color:var(--night2);line-height:1}
.n-cd span{color:var(--soft);font-weight:700;font-size:13px}
.n-done h4{text-decoration:line-through;opacity:.7}
.n-tl{position:relative;padding-inline-start:30px;display:flex;flex-direction:column;gap:14px;max-width:640px}
.n-tl:before{content:"";position:absolute;inset-inline-start:13px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--line)}
.n-tl-item{position:relative}
.n-dot{position:absolute;inset-inline-start:-32px;top:8px;width:30px;height:30px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:grid;place-items:center;font-size:15px}

@keyframes ncTw{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
@keyframes lmFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.lm-scene .float{animation:lmFloat 4s ease-in-out infinite;transform-origin:center}
@media (max-width:720px){
 .lm-hero{grid-template-columns:1fr auto;padding:16px}
 .lm-scene{display:none}
 .lm-count{width:90px;height:90px}.lm-count b{font-size:28px}
 .lm-two{grid-template-columns:1fr}
 .lm-db{grid-template-columns:1fr}
 .lm-panel{padding:14px}
 .lm-choice{grid-template-columns:1fr}
}
@media (max-width:380px){.lm-ticket{grid-template-columns:1fr}.lm-ticket .s{border-inline-start:0;border-top:3px dashed var(--line);flex-direction:row}.lm-ticket .s::before,.lm-ticket .s::after{display:none}}
@media (prefers-reduced-motion:reduce){.lm-scene .float,.lm-hero .tw{animation:none}}

const prettyHost=l=>{const h=host(l);const m={'airbnb':'Airbnb','booking':'Booking','amazon':'Amazon','ikea':'IKEA','leroymerlin':'Leroy Merlin','mediamarkt':'MediaMarkt','elcorteingles':'El Corte Inglés','zarahome':'Zara Home','hm':'H&M','aliexpress':'AliExpress','pccomponentes':'PcComponentes','carrefour':'Carrefour','maisonsdumonde':'Maisons du Monde','expedia':'Expedia','vrbo':'Vrbo','tripadvisor':'Tripadvisor'};for(const k in m)if(h.includes(k))return m[k];return h};

const clean=o=>{const r={};for(const k in o)if(o[k]!==undefined)r[k]=o[k];return r};
function compress(file,mx){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=mx||900,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);let q=.75,d=c.toDataURL('image/jpeg',q);while(d.length>700000&&q>.35){q-=.1;d=c.toDataURL('image/jpeg',q)}d.length>900000?rej():res(d)};img.onerror=()=>rej();img.src=u})}

function connect(){
  let s=null;try{s=localStorage.getItem('nc-space')}catch(e){}
  if(s===sp)return;
  unsubs.forEach(u=>u());unsubs=[];sp=s;S.luna={items:{},trip:{}};S.casa={items:{}};S.gal={};S.citas={};S.stock={items:{}};S.juegos={};S.boda={items:{},meta:{}};S.alquiler={items:{},meta:{}};S.nosotros={items:{},meta:{}};seeded=false;
  if(!s||!fdb){render();return}
  const sub=(path,fn)=>unsubs.push(onSnapshot(collection(fdb,'espacios',s,path),snap=>{const m={};snap.forEach(d=>{m[d.id]={...d.data(),id:d.id}});fn(m);render()},()=>toast(t('errSave'))));
  sub('luna',m=>S.luna.items=m);
  unsubs.push(onSnapshot(collection(fdb,'espacios',s,'casa'),snap=>{const m={};snap.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S.casa.items=m;render();if(!snap.metadata.fromCache)maybeSeed()},()=>toast(t('errSave'))));
  sub('galeria',m=>S.gal=m);
  sub('stock',m=>S.stock.items=m);
  sub('boda',m=>S.boda.items=m);
  sub('alquiler',m=>S.alquiler.items=m);
  sub('nosotros',m=>S.nosotros.items=m);
  unsubs.push(onSnapshot(doc(fdb,'espacios',s,'nosmeta','datos'),d=>{S.nosotros.meta=d.exists()?d.data():{};render()},()=>{}));
  unsubs.push(onSnapshot(doc(fdb,'espacios',s,'alqmeta','datos'),d=>{S.alquiler.meta=d.exists()?d.data():{};render()},()=>{}));
  unsubs.push(onSnapshot(doc(fdb,'espacios',s,'bodameta','datos'),d=>{S.boda.meta=d.exists()?d.data():{};render()},()=>{}));
  unsubs.push(onSnapshot(collection(fdb,'espacios',s,'juegos'),snap=>{const m={};snap.forEach(d=>{m[d.id]={...d.data(),id:d.id}});S.juegos=m;onJuegosSnap()},()=>{}));
  unsubs.push(onSnapshot(collection(fdb,'espacios',s,'citas'),snap=>{const m={};snap.forEach(d=>{const x=d.data();m[d.id]={titulo:x.titulo,fecha:x.fecha,hora:x.hora,hecho:x.hecho}});S.citas=m;renderDash()},()=>{}));
  unsubs.push(onSnapshot(doc(fdb,'espacios',s,'lunaviaje','viaje'),d=>{S.luna.trip=d.exists()?d.data():{};render()},()=>{}));

}
async function maybeSeed(){
  if(seeded||!sp||!fdb)return;seeded=true;
  if(Object.values(S.casa.items).some(i=>i.kind==='rincon'))return;
  try{const m=await getDoc(doc(fdb,'espacios',sp,'casameta','init'));if(m.exists())return;
    await setDoc(doc(fdb,'espacios',sp,'casameta','init'),{at:Date.now()});
    const b=Date.now();['salon','cocina','dormitorio','bano','entrada','terraza'].forEach((k,i)=>put('casa',{id:rid(),kind:'rincon',rk:k,title:t('r_'+k),emoji:ROOMS[k][0],colors:[],created:b+i}))}catch(e){}
}
async function addGal(ref,files){
  if(!fdb||!sp||!files.length)return;toast(t('uploading'));

}
async function delGal(id){delete S.gal[id];render();if(fdb&&sp)try{await deleteDoc(doc(fdb,'espacios',sp,'galeria',id))}catch(e){toast(t('errSave'))}}
async function toCal(store,id){
  const it=S[store].items[id];if(!it)return;if(!it.date){toast(t('needDate'));return}
  const titulo=it.kind==='transporte'?`${MODES[it.sub||'tren']} ${it.from} → ${it.to}`:`${KEMO[it.kind]||''} ${it.title}`;
  try{await setDoc(doc(fdb,'espacios',sp,'citas',rid()),{titulo:titulo.trim().slice(0,120),fecha:it.date,hora:it.time||'',nota:it.notes||'',cat:(store==='casa'||store==='alquiler')?'casa':'viaje',hecho:false,fotos:[],creado:Date.now()});put(store,{...it,inCal:true});toast(t('addedCal'))}catch(e){toast(t('errSave'))}
}
function priceTrack(old,np){
  if(np==null)return{};
  if(old&&old.price!=null&&old.price!==np)return{priceAt:Date.now(),priceHist:[...(old.priceHist||[]),{p:old.price,at:old.priceAt||old.created||Date.now()}].slice(-12)};
  if(!old||old.price==null||!old.priceAt)return{priceAt:Date.now()};
  return{};
}
async function put(store,it){

}

function mountPad(){
  const c=$('gPad');if(!c){G.pad=null;return}
  const ctx=c.getContext('2d');const W=c.width,H=c.height;
  const P={strokes:[],cur:null,color:'#2A2A2A',size:9};
  const line=(s)=>{ctx.strokeStyle=s.c;ctx.lineWidth=s.w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.p.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.p.length===1)ctx.lineTo(s.p[0][0]+.1,s.p[0][1]);ctx.stroke()};
  const redraw=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);P.strokes.forEach(line)};
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  c.addEventListener('pointerdown',e=>{e.preventDefault();try{c.setPointerCapture(e.pointerId)}catch(_){}const w=(P.color==='#FFFFFF'?P.size*3:P.size)*(W/400);P.cur={c:P.color,w,p:[pos(e)]};P.strokes.push(P.cur);line(P.cur)});
  c.addEventListener('pointermove',e=>{if(!P.cur)return;e.preventDefault();const p=pos(e);const last=P.cur.p[P.cur.p.length-1];P.cur.p.push(p);ctx.strokeStyle=P.cur.c;ctx.lineWidth=P.cur.w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last[0],last[1]);ctx.lineTo(p[0],p[1]);ctx.stroke()});
  const up=()=>{P.cur=null};c.addEventListener('pointerup',up);c.addEventListener('pointercancel',up);c.addEventListener('pointerleave',up);
  P.undo=()=>{P.strokes.pop();redraw()};P.clear=()=>{P.strokes=[];redraw()};
  P.export=()=>{const o=document.createElement('canvas');o.width=o.height=420;o.getContext('2d').drawImage(c,0,0,420,420);return o.toDataURL('image/jpeg',.72)};
  redraw();G.pad=P;
}

  const lvl=`<div class="lm-chips" style="align-items:center"><span class="lm-meta">${tl('d_level')}:</span>${[1,2,3,4].map(l=>`<button type="button" class="lm-chip" data-gdl="${l}" aria-pressed="${st.level===l}">${tl('d_l'+l)}</button>`).join('')}</div>`;
  const rate=(rated,where)=>rated!=null?`<div class="g-result">${'⭐'.repeat(rated)||'0'} ${tf('d_rated',{n:rated})}</div>`:`<p class="g-lead">${tl('d_rate')}</p><div class="g-actions">${[0,1,2,3].map(n=>`<button type="button" class="lm-btn ${n===3?'gold':'ghost'}" data-gdrate="${where}:${n}">${n?'⭐'.repeat(n):'0'}</button>`).join('')}</div>`;
  const cmp=(seed,level,img)=>`<div class="g-cmp"><figure>${figSvg(seed,level)}<figcaption>${tl('d_orig')}</figcaption></figure><figure>${img?`<img src="${img}" alt="" class="g-fig">`:`<div class="g-fig g-paperbox">📄</div>`}<figcaption>${tl('d_drawn')}</figcaption></figure></div>`;
  const change=`<button type="button" class="lm-link" data-gdrole="" style="color:#8E6A2B">↺ ${tl('d_change')}</button>`;
  if(!st.role)return `<p class="g-lead">${tl('d_twoNote')}</p><h4 class="lm-sub">${tl('d_role')}</h4><div class="g-roles"><button type="button" class="g-card" data-gdrole="desc"><span class="g-emo">🗣️</span><h4>${tl('d_desc').replace('🗣️ ','')}</h4></button><button type="button" class="g-card" data-gdrole="draw"><span class="g-emo">✏️</span><h4>${tl('d_draw').replace('✏️ ','')}</h4></button><button type="button" class="g-card" data-gdrole="paper"><span class="g-emo">📄</span><h4>${tl('d_paper').replace('📄 ','')}</h4></button></div>`;
  if(st.role==='paper'){
    if(!st.pseed)return lvl+`<p class="g-lead">${tl('d_paperTell')}</p><div class="g-actions"><button type="button" class="lm-btn gold g-main" data-gdnew="1">${tl('d_new')}</button></div>`+change;
    return lvl+`<p class="g-lead">${tl('d_tell')}</p><div class="g-figw">${figSvg(st.pseed,st.plevel)}</div>`+rate(st.prated,'paper')+`<div class="g-actions"><button type="button" class="lm-btn gold g-main" data-gdnew="1">${tl('d_new')}</button></div>`+change}
  if(st.role==='desc'){
    if(sa.state==='drawing'&&sa.seed)return `<p class="g-lead">${tl('d_tell')}</p><div class="g-figw">${figSvg(sa.seed,sa.level)}</div><p class="g-wait">⏳ ${tl('d_wait')}</p>`+lvl+`<div class="g-actions"><button type="button" class="lm-btn ghost" data-gdnew="1">${tl('d_new')}</button></div>`+change;
    if(sa.state==='reveal'&&sa.seed)return cmp(sa.seed,sa.level,sa.drawing)+rate(sa.rated,'sala')+lvl+`<div class="g-actions"><button type="button" class="lm-btn gold g-main" data-gdnew="1">${tl('d_new')}</button></div>`+change;
    return lvl+`<div class="g-actions"><button type="button" class="lm-btn gold g-main" data-gdnew="1">${tl('d_new')}</button></div>`+change}
  if(sa.state==='drawing'&&sa.seed)return `<p class="g-lead">${tl('d_go')}</p>`+padHtml()+`<div class="g-actions"><button type="button" class="lm-btn gold g-main" data-gddone="1">${tl('d_done')}</button></div>`+change;
  if(sa.state==='reveal'&&sa.seed)return cmp(sa.seed,sa.level,sa.drawing)+(sa.rated!=null?rate(sa.rated,'sala'):`<p class="g-wait">⏳</p>`)+`<p class="g-wait">${tl('d_waitFig')}</p>`+change;
  return `<p class="g-wait">⏳ ${tl('d_waitFig')}</p>`+change;
}

  const body=G.game?`<div class="g-top"><button type="button" class="lm-btn ghost sm" data-gback="1">${tl('g_back')}</button><h3 class="g-h">${GAMES.find(x=>x[0]===G.game)[1]} ${tl('gn_'+G.game)}</h3><span id="gStat">${gStat()}</span></div>${gBody()}`:gHub();

function nextWord(){const st=G.st;st.word=pickWord();if(G.game==='adivina')st.mode=rnd(GL().am);
  const w=$('gWord');if(w)w.textContent=st.word;const w2=$('gWord2');if(w2)w2.textContent=st.word;const m=$('gMode');if(m)m.textContent=st.mode;const sm=document.querySelector('.g-wordbox small');if(sm&&G.game==='adivina')sm.textContent=st.mode;
  const c=$('gCount');if(c)c.textContent=st.count;if(G.pad)G.pad.clear()}
function c4win(b,idx,p){const r0=Math.floor(idx/7),c0=idx%7;for(const[dr,dc]of[[0,1],[1,0],[1,1],[1,-1]]){const cells=[idx];for(const s of[1,-1]){let r=r0+dr*s,c=c0+dc*s;while(r>=0&&r<6&&c>=0&&c<7&&b[r*7+c]===p){cells.push(r*7+c);r+=dr*s;c+=dc*s}}if(cells.length>=4)return cells}return null}
function gClick(e){
  const b=e.target.closest('button');if(!b){const z=e.target.closest('[data-zoom]');if(z)onClick(e);return}
  const d=b.dataset;const st=G.st;
  if(d.gopen){initGame(d.gopen);renderJuegos();window.scrollTo({top:juegos.offsetTop-10});return}
  if(d.gback){stopTimer();G.game=null;renderJuegos();return}
  if(d.glang){G.lang=d.glang;try{localStorage.setItem('nc-glang',G.lang)}catch(_){}renderJuegos();return}
  if(d.gpc&&G.pad){G.pad.color=d.gpc;document.querySelectorAll('.g-col').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.gps&&G.pad){G.pad.size=+d.gps;document.querySelectorAll('.g-sz').forEach(x=>x.classList.toggle('on',x===b));return}
  if(d.gpu&&G.pad){G.pad.undo();return}
  if(d.gpx&&G.pad){G.pad.clear();return}
  /* preguntas */
  if(d.gqcat){st.cat=d.gqcat;if(st.cat!=='fav'){st.cur=genQ(st.cat);st.n++}renderJuegos();return}
  if(d.gqnext){st.cur=genQ(st.cat);st.n++;st.who=3-st.who;renderJuegos();return}
  if(d.gqwho){st.who=3-st.who;renderJuegos();return}
  if(d.gqfav){if(fdb&&sp)setDoc(doc(fdb,'espacios',sp,'juegos','favoritas'),{list:arrayUnion(st.cur.q)},{merge:true}).then(()=>{toast(tl('q_saved'));setTimeout(renderJuegos,300)}).catch(()=>toast(t('errSave')));return}
  if(d.gqunfav){if(fdb&&sp)setDoc(doc(fdb,'espacios',sp,'juegos','favoritas'),{list:arrayRemove(d.gqunfav)},{merge:true}).then(()=>setTimeout(renderJuegos,300));return}
  /* prefieres */
  if(d.gpick){const[p,c]=d.gpick.split(':').map(Number);st.pick[p]=c;if(st.pick[1]!=null&&st.pick[2]!=null)addStat('prefieres',{same:st.pick[1]===st.pick[2]?1:0,total:1});renderJuegos();return}
  if(d.gpnext){st.pair=genPair();st.pick={1:null,2:null};renderJuegos();return}
  /* conoce */
  if(d.gk){const v=(($('gKin')||{}).value||'').trim();
    if(d.gk==='hide'||d.gk==='reveal'){if(!v){$('gKerr').hidden=false;$('gKin').focus();return}if(d.gk==='hide'){st.a=v;st.phase='guess'}else{st.g=v;st.phase='reveal';st.judged=0}renderJuegos();const i=$('gKin');if(i)i.focus();return}
    if(d.gk==='yes'){st.judged=1;addPt('conoce',3-st.ans);renderJuegos();return}
    if(d.gk==='no'){st.judged=2;renderJuegos();return}
    if(d.gk==='next'){st.ans=3-st.ans;st.q=pickFresh(GL().k)||rnd(GL().k);seenAdd(st.q);st.phase='answer';st.a=st.g='';st.judged=0;renderJuegos();return}}
  /* describe */
  if(d.gdrole!==undefined){st.role=d.gdrole||null;try{sessionStorage.setItem('nc-drole',st.role||'')}catch(_){}G.dKey='';renderJuegos();return}
  if(d.gdl){st.level=+d.gdl;renderJuegos();return}
  if(d.gdnew){const seed=Math.floor(Math.random()*1e9);if(st.role==='paper'){st.pseed=seed;st.plevel=st.level;st.prated=null;renderJuegos()}else gSet('sala',{seed,level:st.level,state:'drawing',drawing:null,rated:null,at:Date.now()},false);return}
  if(d.gddone&&G.pad){const img=G.pad.export();gSet('sala',{state:'reveal',drawing:img});return}
  if(d.gdrate){const[w,n]=d.gdrate.split(':');const v=+n;if(w==='paper'){st.prated=v;renderJuegos()}else gSet('sala',{rated:v});addStat('describe',{stars:v,rounds:1});return}
  /* pictionary / adivina */
  if(d.gtw){
    if(d.gtw==='start'){st.phase='play';st.count=0;st.hide=false;st.word=pickWord();if(G.game==='adivina')st.mode=rnd(GL().am);G.tLeft=60;renderJuegos();startTimer(60,()=>{st.phase='end';renderJuegos()});return}
    if(d.gtw==='hit'){st.count++;addPt(G.game,st.turn);nextWord();return}
    if(d.gtw==='skip'){nextWord();return}
    if(d.gtw==='eye'){st.hide=!st.hide;const w=$('gWord');if(w)w.classList.toggle('blur',st.hide);b.textContent=st.hide?tl('pi_show'):tl('pi_hide');return}
    if(d.gtw==='next'){st.turn=3-st.turn;st.phase='ready';renderJuegos();return}}
  /* conecta */
  if(d.gc4!==undefined&&!st.win){const c=+d.gc4;for(let r=5;r>=0;r--){const i=r*7+c;if(!st.b[i]){st.b[i]=st.turn;const line=c4win(st.b,i,st.turn);if(line){st.win=st.turn;st.line=line;addPt('conecta',st.turn)}else if(st.b.every(x=>x))st.win=3;else st.turn=3-st.turn;st.last=i;renderJuegos();const el=juegos.querySelectorAll('.g-cell')[i];if(el)el.classList.add('drop');return}}return}
  if(d.gc4new){initGame('conecta');renderJuegos();return}
  /* memoria */
  if(d.gmc!==undefined){const i=+d.gmc;const c=st.cards[i];if(st.lock||st.done||c.open||c.by)return;c.open=true;
    if(st.first==null){st.first=i;renderJuegos();return}
    const f=st.cards[st.first];st.first=null;
    if(f.e===c.e){f.by=c.by=st.turn;f.open=c.open=false;st.pts[st.turn]++;if(st.cards.every(x=>x.by)){st.done=true;if(st.pts[1]!==st.pts[2])addPt('memoria',st.pts[1]>st.pts[2]?1:2)}renderJuegos();return}
    st.lock=true;renderJuegos();setTimeout(()=>{f.open=c.open=false;st.lock=false;st.turn=3-st.turn;if(G.game==='memoria')renderJuegos()},950);return}
  if(d.gmnew){initGame('memoria');renderJuegos();return}
  /* ruleta */
  if(d.grul){
    if(d.grul==='spin'&&!st.spinning){const idx=Math.floor(Math.random()*8);st.rot=Math.ceil(st.rot/360)*360+1800+((360-idx*45-22.5)%360);st.spinning=true;b.disabled=true;const w=$('gWheel');if(w)w.style.transform=`rotate(${st.rot}deg)`;
      setTimeout(()=>{st.spinning=false;st.cat=RCATS[idx][0];st.dare=rnd(GL().r[st.cat]);if(G.game==='ruleta')renderJuegos()},3400);return}
    if(d.grul==='swap'){st.dare=rnd(GL().r[st.cat]);renderJuegos();return}
    if(d.grul==='done'){addPt('ruleta',st.turn);st.turn=3-st.turn;st.cat=null;renderJuegos();return}}
  /* historia */
  if(d.ghw){const ta=$('gHin');if(ta){ta.value=(ta.value+(ta.value&&!/\s$/.test(ta.value)?' ':'')+d.ghw).trimStart();ta.focus()}return}
  if(d.gh==='add'){const v=(($('gHin')||{}).value||'').trim();if(!v){$('gHin').focus();return}st.lines.push({p:st.turn,t:v});st.turn=3-st.turn;st.words=pick3();renderJuegos();const ta=$('gHin');if(ta)ta.focus();return}
  if(d.gh==='end'){if(st.lines.length<2){$('gHerr').hidden=false;return}const id='h_'+rid();const title=st.start.replace(/…$/,'').split(/\s+/).slice(0,6).join(' ')+'…';gSet(id,{kind:'historia',title,start:st.start,lines:st.lines,created:Date.now()},false).then(()=>toast(tl('h_saved')));initGame('historia');renderJuegos();return}
  if(d.ghdel){if(b.classList.contains('danger')){if(fdb&&sp)deleteDoc(doc(fdb,'espacios',sp,'juegos',d.ghdel)).then(()=>setTimeout(renderJuegos,200));return}b.classList.add('danger');b.textContent=t('sure');return}
}

     <div class="b-names">${at.map(g=>`<span class="b-name">${esc(g.title)}${pers(g)>1?' +'+(pers(g)-1):''}</span>`).join('')}</div>${acts('boda',m)}</article>`}).join('')}</div>`;

  if(d.aadd){const pre={};if(d.aadd==='gvar'){pre.date=curM()===ymNow()?todayISO():curM()+'-01';pre.payer='n1';pre.forWho='ambos';pre.cat='comida'}if(d.aadd==='gfijo'){pre.freq=1;pre.who='ambos';pre.cat='vivienda'}if(d.aadd==='piso'){pre.pstatus=filt.ap_s&&filt.ap_s!=='*'?filt.ap_s:'interesa';pre.zone=am().city||''}openForm(d.aadd,null,pre);return true}
  if(d.aqb!=null){const q=(tl('qbills')||[])[+d.aqb];if(q){const pre={title:q[0],cat:q[1],freq:q[2],who:'ambos'};if(+d.aqb===0&&rentRef()){pre.amount=rentRef();if(am().cday)pre.day=am().cday}openForm('gfijo',null,pre)}return true}
  if(d.amon!=null){filt.aMonth=+d.amon===0?ymNow():ymShift(curM(),+d.amon);render();return true}
  if(d.asettle){const net=balance();const amt=Math.round(Math.abs(net[0])*100)/100;if(amt<0.5)return true;const debtor=net[0]>0?'n2':'n1',cred=debtor==='n1'?'n2':'n1';
    put('alquiler',{id:rid(),kind:'gvar',settle:true,title:tl('a_settled'),amount:amt,payer:debtor,forWho:cred,cat:'otros',date:todayISO(),created:Date.now()});toast(tl('a_settleQ').replace('{a}',an(debtor)).replace('{x}',eur(amt)).replace('{b}',an(cred)));return true}
  if(d.agoal){const s=goalSugg().find(x=>x[0]===d.agoal);if(s){const g={id:rid(),kind:'ahorro',title:s[1]+' '+tl('g_'+s[0]),target:s[2],saved:0,created:Date.now()};if(s[0]==='entrada'&&am().moveDate)g.date=am().moveDate;if(s[0]==='boda'&&S.boda.meta.date)g.date=S.boda.meta.date;if(s[0]==='luna'&&S.luna.trip.start)g.date=S.luna.trip.start;put('alquiler',g);toast(t('saved'))}return true}
  if(d.asave){const[id,a]=d.asave.split(':');const g=S.alquiler.items[id];if(g)put('alquiler',{...g,saved:(+g.saved||0)+(+a)});return true}
  if(d.aentgoal){const e=entry();const ttl='🔑 '+tl('g_entrada');const ex=al('ahorro').find(g=>g.title===ttl);put('alquiler',{...(ex||{id:rid(),kind:'ahorro',saved:0,created:Date.now()}),title:ttl,target:Math.round(e.total),date:am().moveDate||(ex&&ex.date)||null});tabA='ahorro';try{localStorage.setItem('nc-atab',tabA)}catch(_){}toast(t('saved'));return true}
  if(d.ausecasa){putAlqMeta({...am(),eFurn:Math.round(cSums().pend)});toast(t('saved'));return true}
  if(d.achoose){const p=S.alquiler.items[d.achoose];if(!p)return true;al('piso').filter(x=>x.pstatus==='elegido'&&x.id!==p.id).forEach(x=>put('alquiler',{...x,pstatus:'visto'}));put('alquiler',{...p,pstatus:'elegido'});
    const m={...am()};if(!m.crent&&p.rent)m.crent=+p.rent;if(!m.addr)m.addr=[p.title,p.zone].filter(Boolean).join(', ');if((m.extraM==null||m.extraM==='')&&p.extra!=null)m.extraM=+p.extra||0;putAlqMeta(m);
    const q=tl('qbills')||[];const gs=al('gfijo');let added=false;
    if(p.rent&&!gs.some(g=>g.title===q[0][0])){put('alquiler',{id:rid(),kind:'gfijo',title:q[0][0],cat:'vivienda',amount:+p.rent,freq:1,who:'ambos',created:Date.now()});added=true}
    if(p.comm&&!gs.some(g=>g.title===q[1][0])){put('alquiler',{id:rid(),kind:'gfijo',title:q[1][0],cat:'vivienda',amount:+p.comm,freq:1,who:'ambos',created:Date.now()+1});added=true}
    toast(added?tl('a_rentAdded'):t('saved'));return true}
  if(d.asrch){const q=(($('ncAlqQ')||{}).value||am().city||'').trim();window.open('https://www.google.com/search?q='+encodeURIComponent(`site:${d.asrch} alquiler ${q}`),'_blank','noopener');return true}
  if(d.apq){put('alquiler',{id:rid(),kind:'apapel',title:d.apq,done:false,created:Date.now()});return true}
  if(d.apqall){const have=al('apapel').map(x=>x.title);const base=Date.now();(tl('qpapers')||[]).filter(s=>!have.includes(s)).forEach((s,i)=>put('alquiler',{id:rid(),kind:'apapel',title:s,done:false,created:base+i}));toast(t('saved'));return true}
  if(d.acalend){const nd=noticeDate(),ce=contractEnd();if(!nd)return true;(async()=>{try{await setDoc(doc(fdb,'espacios',sp,'citas',rid()),{titulo:('⏰ '+tl('a_noticeShort')+' — '+(am().addr||tl('nav7'))).slice(0,120),fecha:nd,hora:'',nota:tl('a_contractEnd').replace('{d}',fd(ce,{day:'numeric',month:'long',year:'numeric'})),cat:'casa',hecho:false,fotos:[],creado:Date.now()});putAlqMeta({...am(),calEnd:true});toast(t('addedCal'))}catch(_){toast(t('errSave'))}})();return true}
  return false;
}

function togYM(){const s=nm8().since;if(!s)return null;const a=new Date(s+'T12:00:00'),b=new Date();let m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;return{y:Math.floor(m/12),m:m%12}}
function nextOcc(d,yearly){if(!d)return null;if(!yearly)return{date:d,n:daysTo(d),years:null};const x=new Date(d+'T12:00:00');const now=new Date();let y=now.getFullYear();let c=new Date(y,x.getMonth(),x.getDate(),12);if(daysTo(c.toISOString().slice(0,10))<0)c=new Date(++y,x.getMonth(),x.getDate(),12);const iso=`${c.getFullYear()}-${String(c.getMonth()+1).padStart(2,'0')}-${String(c.getDate()).padStart(2,'0')}`;return{date:iso,n:daysTo(iso),years:y-x.getFullYear()}}
function allDates(){const out=nl('fecha').map(f=>({it:f,title:f.title,...nextOcc(f.date,f.yearly)}));const m=nm8();
  if(m.since&&!nl('fecha').some(f=>f.date===m.since))out.push({auto:1,title:tl('n_ann'),...nextOcc(m.since,true)});

  return out.filter(x=>x.date).sort((a,b)=>(a.n<0)-(b.n<0)||a.n-b.n)}

function nAcuerdos(){
